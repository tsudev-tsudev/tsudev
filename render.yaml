# Blueprint Render. MỘT service - xem docs/deployment.md.
#
# NGÂN SÁCH GIỜ CHẠY, đọc trước khi thêm service: gói free cấp 750 giờ instance
# mỗi tháng cho CẢ TÀI KHOẢN, không phải cho mỗi service. Một service chạy liên
# tục tiêu 720 giờ. Nghĩa là chỉ giữ ấm được ĐÚNG MỘT service, và đó là
# tsudev-backend (nằm trên mọi đường đọc của site).
#
# tsudev-sso - service danh tính riêng của bản thiết kế cũ - ĐÃ ĐƯỢC GỠ. Xác
# thực nay do codebase tự quản lý và nằm
# trong chính tsudev-backend, nên toàn bộ 750 giờ dồn về một chỗ thay vì phải
# để đường đăng nhập ngủ và trả giá bằng cold start ở lần đăng nhập đầu tiên.
# Thêm service thứ hai chạy liên tục là vỡ ngân sách.
#
# REGION LÀ BẤT BIẾN sau khi service được tạo. Đổi `region` trong file này
# KHÔNG di chuyển service đang chạy - phải xoá và dựng lại. Trước đây không khai
# region nên cả bốn service nằm ở Oregon (mặc định của Render), cách Việt Nam
# ~180ms mỗi lượt gọi SSR; singapore còn ~40ms.
services:
  # Ba service backend cũ (content/storage/trust) gộp thành MỘT tiến trình.
  # Lý do và cách điều phối: services/backend-bundle/src/index.js.
  - type: web
    name: tsudev-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/backend-service.Dockerfile
    dockerContext: .
    # dist/, không phải src/ - backend chạy bản đã biên dịch từ TypeScript.
    # Bước dựng nằm trong docker/backend-service.Dockerfile (npm run build:ts).
    dockerCommand: node services/backend-bundle/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Gác /api của nhánh content và storage. Nhánh trust CỐ Ý đứng ngoài -
      # huy hiệu, trang xác minh và JWKS phải công khai cho bên thứ ba.
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      # S3_ENDPOINT (nội bộ) và S3_PUBLIC_ENDPOINT (qua CDN) là HAI biến khác
      # nhau. Gộp lại thì URL presign trả về cho trình duyệt trỏ vào host nội bộ.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: tsudev
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Khoá ký KHẲNG ĐỊNH DANH TÍNH mà BFF gửi xuống. PHẢI trùng giá trị đặt
      # ở Cloudflare Workers cho frontend - lệch nhau thì mọi đường ghi đã xác
      # thực trả 401, đúng triệu chứng mà cơ chế này ra đời để chấm dứt.
      - key: INTERNAL_IDENTITY_SECRET
        sync: false
      # --- nhánh identity (auth-service) ---
      # Mã hoá bí mật TOTP khi lưu. Đổi giá trị này = mọi thiết bị 2FA hỏng.
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      # Đường gửi thư giao dịch: xác minh email và đặt lại mật khẩu. Resend là
      # API HTTP chứ không phải SMTP, vì frontend chạy trên Cloudflare Workers
      # nơi không mở được socket TCP tuỳ ý.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: tsudev <no-reply@tsudev.com>
      # Liên kết trong thư dựng từ biến này. Thiếu ở production ⇒ nhánh identity
      # từ chối khởi động: một liên kết hỏng chỉ lộ ra ở hộp thư người dùng, nơi
      # không log nào bắt được.
      - key: NEXT_PUBLIC_MAIN_URL
        value: https://tsudev.com
      # Thiếu ở production ⇒ nhánh trust từ chối khởi động, và vì đã gộp nên
      # CẢ tiến trình không lên. Cố ý: thà chết ồn ào còn hơn ký bằng khoá dev.
      - key: TRUST_SIGNING_KEY
        sync: false
      - key: TRUST_SIGNING_KEY_ID
        sync: false
      # ĐƯỢC KÝ VÀO CHỨNG CHỈ. Chữ ký vẫn xác minh được nếu đổi (khoá theo kid),
      # nhưng URL trong chứng chỉ ĐÃ CẤP thì cố định vĩnh viễn - đổi sau là link
      # rot. Đặt đúng domain thật TRƯỚC lần cấp đầu tiên. Xem docs/trust-seal.md.
      - key: TRUST_ISSUER
        value: https://tsudev.com
      # --- nhánh newsroom (Toà soạn Agent AI) ---
      # CÔNG TẮC TỔNG, và là van chi phí quan trọng nhất của repo. Không đặt,
      # hay đặt bất cứ giá trị nào khác 'true', thì dispatcher trả về ngay ở
      # dòng đầu và KHÔNG gọi LLM lần nào.
      #
      # ⚠️ TRƯỚC 26/08/2026 chỗ này là `value: 'false'`, và đó là một cái bẫy đã
      # nổ: giá trị literal trong blueprint GHI ĐÈ giá trị đang chạy ở mỗi lần
      # đồng bộ. Toà soạn đang chạy tốt thì tự tắt sau một lần deploy, và triệu
      # chứng là "hôm nay không có bài nào" - im lặng tuyệt đối, vì `tick()`
      # thoát ở dòng đầu TRƯỚC mọi lệnh ghi nhật ký, nên không có sự kiện nào để
      # ai nhìn thấy. Đo được ngày 26/08: hôm trước 125 sự kiện/13 loại, hôm sau
      # đúng 2 sự kiện và cả hai đều do người bấm tay.
      #
      # `sync: false` giữ NGUYÊN mục tiêu an toàn - service dựng mới từ blueprint
      # không có giá trị này nên vẫn tắt - mà bỏ được vế ghi đè. Bật/tắt từ nay
      # là việc của bảng điều khiển Render, và blueprint không giành lại nữa.
      - key: NEWSROOM_ENABLED
        sync: false
      # Gác /api/newsroom/tick. PHẢI trùng secret cùng tên của Worker cron
      # (infrastructure/newsroom-cron). Lệch nhau ⇒ mọi lượt tick trả 401 và
      # toà soạn đứng yên trong im lặng.
      - key: NEWSROOM_TICK_TOKEN
        sync: false
      # Trần Neuron/ngày. Hạn mức miễn phí của Workers AI là 10.000 (reset
      # 00:00 UTC); 8000 chừa biên 20%. Vượt hạn mức trên gói Free thì
      # Cloudflare TỪ CHỐI request chứ không tính tiền - van này để toà soạn
      # chủ động chuyển sang dự phòng trước khi bị từ chối.
      - key: NEWSROOM_DAILY_NEURON_BUDGET
        value: '8000'
      # Trần số vòng Writer<->Editor cho một bài. Không trần = đốt hạn mức im lặng.
      - key: NEWSROOM_MAX_REVISIONS
        value: '2'
      # Workers AI qua REST (service này chạy trên Render, không phải trên
      # Workers, nên không dùng binding được). Token cần đúng phạm vi
      # "Workers AI" và không gì khác.
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_AI_TOKEN
        sync: false
      # Dự phòng khi cạn Neuron. Bỏ trống cũng chạy: cạn thì toà soạn dừng và
      # ghi event. ⚠️ Khoá phải lấy từ project KHÔNG bật billing - bật billing
      # là Google chuyển sang bậc trả tiền ngay, xem docs/free-tier.md.
      - key: GEMINI_API_KEY
        sync: false
      # --- bí danh thư nội bộ `*@tsudev.com` (Cloudflare Email Routing) ---
      # Đặt ở ĐÂY chứ không ở Cloudflare Worker: secret khai ở Worker lộ trong
      # bản dựng. Bí danh do nhánh identity gọi, mà nhánh đó chạy trên Render;
      # frontend chỉ proxy qua /api/account/alias/*.
      #
      # Thiếu hai biến này KHÔNG làm service chết - `isConfigured()` trả false và
      # trang quản trị hiện thẳng "Chưa cấu hình: CF_API_TOKEN, CF_ZONE_ID". Cố ý:
      # bí danh là tính năng phụ, chết cả site vì nó là đổi sai thứ lấy sai thứ.
      #
      # Token phải hẹp đúng một quyền: Zone → Email Routing Rules → Edit, và chỉ
      # cho zone tsudev.com. `CF_ZONE_ID` là Zone ID ở trang Overview của tên
      # miền - KHÔNG phải `CF_ACCOUNT_ID` ở trên (cái đó cho Workers AI).
      #
      # ⚠️ Đặt biến chưa đủ. Bên Cloudflare phải bật Email Routing cho zone (bước
      # này GHI ĐÈ bản ghi MX) và XÁC MINH địa chỉ đích - mã chỉ tạo quy tắc
      # forward, không tạo và không xác minh destination. Đích chưa verified thì
      # Cloudflare từ chối lúc tạo bí danh. Nghiệm thu: gửi một lá thư THẬT.
      - key: CF_API_TOKEN
        sync: false
      - key: CF_ZONE_ID
        sync: false
