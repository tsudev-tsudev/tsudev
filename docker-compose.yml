services:
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/realm-export.json
      # 4100 chứ không phải 8080: dev-proxy chiếm 8080 để chạy được mà không cần
      # quyền root. Xem config/topology.json.
      - KC_HTTP_PORT=4100
    ports:
      - '4100:4100'
    volumes:
      - ./apps/sso-auth/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Cổng HOST là 5433 để trùng DATABASE_URL trong .env — trước đây map 5432
      # nên `npm run db:migrate` chạy từ host lại migrate cluster user-space chứ
      # không phải Postgres của compose, và không có gì báo. Cổng trong container
      # vẫn 5432 (mặc định của image), service khác nối qua `postgres:5432`.
      # Hệ quả có chủ ý: chạy đồng thời cluster user-space và compose sẽ đụng cổng
      # và compose báo lỗi ngay — thà vậy còn hơn âm thầm tách làm hai database.
      - '5433:5432'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - '9000:9000'
    volumes:
      - minio_data:/data

  user-service:
    build: ./services/user-service
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis

  content-service:
    build: ./services/content-service
    ports:
      - '4001:4001'
    depends_on:
      - postgres

  trust-service:
    build: ./services/trust-service
    ports:
      - '4003:4003'
    environment:
      # Khoá ký của cơ quan cấp dấu. Bắt buộc ở production — service từ chối
      # khởi động nếu thiếu. Sinh bằng: node services/trust-service/scripts/genkey.js
      TRUST_SIGNING_KEY: ${TRUST_SIGNING_KEY}
      TRUST_SIGNING_KEY_ID: ${TRUST_SIGNING_KEY_ID}
      TRUST_ISSUER: ${TRUST_ISSUER:-https://tsudev.vn}
    depends_on:
      - postgres

  frontend-main:
    build:
      context: .
      dockerfile: apps/frontend-main/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - user-service
      - content-service
    environment:
      - NEXTAUTH_URL=http://frontend-main:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - E2E_BYPASS_KEYCLOAK=1
      - KEYCLOAK_ISSUER=http://keycloak:4100/realms/tsudev-local
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}

  frontend-forum:
    build:
      context: .
      dockerfile: apps/frontend-forum/Dockerfile
    ports:
      - '3001:3001'
    depends_on:
      - user-service
    environment:
      - NEXTAUTH_URL=http://frontend-forum:3001
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - KEYCLOAK_ISSUER=http://keycloak:4100/realms/tsudev-local
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}

  storage-service:
    build: ./services/storage-service
    ports:
      - '4002:4002'
    depends_on:
      - minio
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://minio:9000
      - S3_BUCKET=tsudev
      - S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    # Mount only the src directory so we can iterate on runtime code
    # without rebuilding the image and without masking node_modules.
    volumes:
      - ./services/storage-service/src:/usr/src/app/src:cached

  e2e-runner:
    build:
      context: .
      dockerfile: docker/e2e-runner.Dockerfile
    working_dir: /work
    volumes:
      - ./:/work:cached
    environment:
      - E2E_FRONTEND=http://frontend-main:3000
      - E2E_STORAGE=http://storage-service:4002
      - E2E_UPLOAD_PATH=/work/scripts/upload-file.txt
      - E2E_IN_DOCKER=1
      # Use server-side presign+PUT fallback by default for reliable E2E runs.
      - E2E_FORCE_FALLBACK=1
    depends_on:
      - frontend-main
      - keycloak
      - storage-service
    command:
      [
        'bash',
        '-lc',
        "for i in $(seq 1 120); do if ( (echo > /dev/tcp/frontend-main/3000) >/dev/null 2>&1 ) && ( (echo > /dev/tcp/storage-service/4002) >/dev/null 2>&1 ) && ( (echo > /dev/tcp/keycloak/4100) >/dev/null 2>&1 ); then echo 'all services up'; break; fi; echo 'waiting for services...'; sleep 1; done; node /work/scripts/e2e-sso-upload.js",
      ]

volumes:
  postgres_data:
  minio_data:
