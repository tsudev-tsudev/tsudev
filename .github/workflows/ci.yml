name: CI

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request: {}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Hợp đồng mạng (cổng/tên miền)
        run: npm run topology:check
      - run: npm run format:check
      - run: npm run lint --silent
      # Cổng kiểm kiểu. Trước đây repo có typescript trong devDependencies
      # và 3 file .ts/.tsx chạy thật, nhưng KHÔNG có tsconfig nào và không
      # có bước tsc — esbuild chỉ xoá kiểu chứ không kiểm. Bước này đóng lỗ đó.
      # Kiểm kiểu đọc kiểu Prisma qua packages/db/src/index.d.ts, mà client của
      # Prisma là mã SINH RA — chưa generate thì tsc không tìm thấy @prisma/client.
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Kiểm kiểu (TypeScript)
        run: npm run typecheck

  test:
    name: Migrate & test services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsudev
          POSTGRES_PASSWORD: tsudev
          POSTGRES_DB: tsudev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tsudev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://tsudev:tsudev@localhost:5432/tsudev?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Prisma generate + migrate (deploy)
        run: |
          npm run db:generate
          npm run db:migrate
      - name: Run service unit tests
        run: |
          npm --workspace services/content-service test
          npm --workspace services/storage-service test
          npm --workspace services/trust-service test
          # Chế độ gộp là hình trạng CHẠY THẬT trên production. Bỏ dòng này thì
          # bất biến "endpoint công khai của trust không bị cổng chặn của content
          # nuốt" mất người canh, mà triệu chứng của nó là huy hiệu im lặng biến
          # mất trên site khách chứ không phải CI đỏ.
          npm --workspace services/backend-bundle test

  e2e-app:
    name: E2E — smoke các trang được giữ
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tsudev
          POSTGRES_PASSWORD: tsudev
          POSTGRES_DB: tsudev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tsudev"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # 5432 là cổng service container của GitHub Actions, khai ở
      # config/topology.json → overrides.ci kèm lý do.
      DATABASE_URL: postgresql://tsudev:tsudev@localhost:5432/tsudev?schema=public
      NEXTAUTH_SECRET: e2e-placeholder-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Chỉ chromium: bộ `app` không cần engine khác, tải đủ ba là thêm vài phút
      # mỗi lần chạy CI mà không đổi kết quả.
      - run: npx playwright install --with-deps chromium
      # Smoke khẳng định NỘI DUNG THẬT (tiêu đề bài lấy từ DB), nên phải có DB đã
      # migrate + seed. Không có nó thì getServerSideProps nuốt lỗi, trang rỗng
      # vẫn trả 200 và test xanh mà chẳng chứng minh được gì.
      # seed-demo dựng tổ chức + chứng chỉ đã ký. `db:seed` chỉ tạo chương trình
      # dấu, KHÔNG tạo chứng chỉ nào — mà không có chứng chỉ thì /trust/directory
      # rỗng và trang hồ sơ uy tín không có đường nào dẫn tới. Ký bằng khoá dev
      # (chưa đặt TRUST_SIGNING_KEY) là đủ cho smoke; script tự chặn khi
      # NODE_ENV=production.
      - name: Prisma generate + migrate + seed
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          node services/trust-service/scripts/seed-demo.js
      # Playwright tự dựng content-service, trust-service, frontend-main và
      # dev-proxy (webServer trong e2e/playwright.config.js).
      - run: npm run e2e:app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build:
    name: Build frontends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build TypeScript workspaces
        run: npm run build:ts
      - name: Build Next.js apps
        run: |
          npm --workspace apps/frontend-main run build
        env:
          NEXTAUTH_SECRET: build-time-placeholder
